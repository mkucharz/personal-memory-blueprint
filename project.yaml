name: personal-memory
version: "4.4.0"
author: memory
description: >
  A personal AI agent's long-term knowledge graph over a person's life —
  people, organisations, deadlines, tasks, projects, events, finances, and
  notes, plus area packs for companies, money and invoices, assets,
  legal cases, guides, travel, a document registry, and belongings — and the four agents that build, watch, and query it.
repositoryUrl: https://github.com/mkucharz/personal-memory-blueprint

projectInfo: |
  # Personal Memory

  A personal AI agent's long-term knowledge graph. Its main job is that no
  obligation is missed — tax filings and payments, social insurance,
  subscriptions, insurance and domain renewals, inspections, document
  expiries, court deadlines — and that the facts behind them (who, which
  company, which account, which asset) are one search away.

  Core types: Person, Organization, Obligation, Task, Project, Event, Note,
  File, Fact, Place, Contact, FinancialTransaction, Habit.
  Area types: LegalEntity, Contract (companies); Account (money); Vehicle,
  Property, InsurancePolicy, Domain, Server (assets); LegalCase (legal);
  Guide (knowledge); Invoice (money); IdentityDocument, Trip, Booking,
  Claim (travel); Document (documents — what we have and where); Item
  (belongings — hardware, tools, gear, where it is and who owns it).

  Every due date lives on an Obligation linked from its subject with
  `has_obligation`. The obligations-watcher turns upcoming obligations into
  Tasks each morning and rolls them forward when the Task is done; the
  daily-briefing shows the next 14 days. memory-extractor builds the graph
  from email, calendar, and conversations; personal-kb-agent saves and
  recalls on request. Never store passwords, keys, tokens, or full card
  or account numbers; identity document numbers only when the user wants them.

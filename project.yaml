name: personal-memory
version: "3.1.0"
author: memory
description: >
  A personal AI agent's long-term knowledge graph over a person's life —
  people, tasks, projects, events, finance, contacts, places, notes, files,
  facts, and habits — plus the three agents that build and query it.
repositoryUrl: https://github.com/mkucharz/personal-memory-blueprint

projectInfo: |
  # Personal Memory Blueprint

  A personal AI agent's long-term knowledge graph covering people, tasks, projects,
  events, financial transactions, contacts, places, notes, files, facts, and habits.
  The memory-extractor agent builds and maintains the graph from emails, events, and
  conversations; the daily-briefing agent surfaces what matters each morning; the
  personal-kb-agent saves and recalls information on request.

  This is the combined personal-memory + personal-kb pack (v3.1.0): it adds the
  Fact type, standardizes on the general Note and Event names (renamed from Memo
  and CalendarEvent), and uses the platform's semantic property types (email,
  phone, country, currency, time) so values are validated and normalized on write.

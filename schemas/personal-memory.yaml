name: personal-memory
version: "4.1.0"
author: memory
repositoryUrl: https://github.com/mkucharz/personal-memory-blueprint
description: >
  Core pack of the personal-memory blueprint. Owns the shared types every
  area pack links to: people, organisations, obligations (anything with a
  due date), tasks, projects, events, finances, contacts, places, notes,
  files, facts, and habits. Area packs in this blueprint (pm-companies,
  pm-money, pm-assets, pm-legal, pm-knowledge) reference these types by name
  and never redeclare them. v4.0.0 adds Organization and Obligation, and
  Person fields used by the existing graph (name, email, is_self).

objectTypes:
  - name: Person
    label: Person
    labels: [person]
    ui:
      icon: "👤"
      color: "#6366F1"
    description: >
      A person in the user's life — family, friend, colleague, or public figure.
      Built and enriched from email, calendar, contacts, and conversation context.
    properties:
      name:
        type: string
        description: Full name as usually written (primary label)
      first_name:
        type: string
        title: First name
        description: First name
      last_name:
        type: string
        title: Last name
        description: Last name
      display_name:
        type: string
        title: Display name
        description: Full display name or preferred name
      is_self:
        type: boolean
        title: Is the user
        description: True on exactly one Person, the user this graph belongs to
      relationship:
        type: string
        title: Relationship
        description: Relationship to the user
        enum: [self, partner, family, friend, colleague, business_partner, advisor, service_provider, acquaintance, public_figure]
      email:
        type: string
        format: email
        title: Primary email
        description: Primary email address (accepted alias of emails; personal-kb compatibility)
      emails:
        type: array
        title: Email addresses
        description: Email addresses, most-used first
        items:
          type: string
          format: email
      phones:
        type: array
        title: Phone numbers
        description: Phone numbers, most-used first
        items:
          type: string
          format: phone
      phone:
        type: string
        format: phone
        title: Primary phone
        description: Primary phone number (accepted alias of phones; personal-kb compatibility)
      organization:
        type: string
        title: Organisation
        description: Company or organisation they belong to
      employer:
        type: string
        title: Employer
        description: Employer (accepted alias of organization; personal-kb compatibility)
      job_title:
        type: string
        title: Job title
        description: Job title or role
      occupation:
        type: string
        title: Occupation
        description: Occupation / role (accepted alias of job_title; personal-kb compatibility)
      birthday:
        type: date
        title: Birthday
        description: Birthday (YYYY-MM-DD, stored as RFC 3339)
      notes:
        type: string
        widget: textarea
        title: Notes
        description: Free-form notes about this person
      last_contacted:
        type: date
        title: Last contacted
        description: Date of last contact or interaction
      source:
        type: string
        title: Source
        description: "Where this record originated: gmail, apple_contacts, calendar, manual"
      source_ref:
        type: string
        title: Source reference
        description: "Pointer to the evidence: Gmail thread ID, Drive file ID, inFakt ID, file path, or 'user YYYY-MM-DD' when the user said it"
      confidence:
        type: string
        description: "confirmed (by the user or an official document), from_source (read from a source, not confirmed), unverified (old or indirect data; check before relying on it)"
        enum: [confirmed, from_source, unverified]

  - name: Organization
    label: Organisation
    labels: [organization]
    ui:
      icon: "🏢"
      color: "#0F766E"
    description: >
      An outside organisation the user deals with: a bank, insurer, vendor,
      service provider, government office, court, law or accounting firm,
      school, or airline. Companies the user owns or runs are LegalEntity
      (pm-companies), not Organization.
    properties:
      name:
        type: string
        description: Organisation name
      org_kind:
        type: string
        title: Kind
        description: What sort of organisation this is
        enum: [bank, insurer, vendor, service_provider, government, tax_office, court, law_firm, accounting_firm, employer, client, school, airline, registrar, other]
      country:
        type: string
        format: country
        description: Country of registration (ISO 3166-1 code)
      tax_id:
        type: string
        title: Tax ID
        description: Tax identifier (NIP, VAT number, org number)
      website:
        type: url
        description: Website
      email:
        type: string
        format: email
        description: Main contact email
      phone:
        type: string
        format: phone
        description: Main contact phone
      address:
        type: string
        description: Postal address
      customer_number:
        type: string
        title: Customer number
        description: The user's customer or client number with this organisation
      notes:
        type: string
        widget: textarea
        description: Free-form notes
      source:
        type: string
        description: "Where the facts came from: email, drive, infakt, document, user, migration, manual"
      source_ref:
        type: string
        title: Source reference
        description: "Pointer to the evidence: Gmail thread ID, Drive file ID, inFakt ID, file path, or 'user YYYY-MM-DD' when the user said it"
      confidence:
        type: string
        description: "confirmed (by the user or an official document), from_source (read from a source, not confirmed), unverified (old or indirect data; check before relying on it)"
        enum: [confirmed, from_source, unverified]

  - name: Obligation
    label: Obligation
    labels: [obligation, deadline]
    ui:
      icon: "⏰"
      color: "#DC2626"
    description: >
      Anything with a due date the user must not miss: a tax filing or payment,
      a social-insurance contribution, a subscription renewal, an insurance or
      domain renewal, a vehicle inspection, a contract notice date, or a
      document expiry. Recurring obligations carry an RRULE and a next_due date
      that is rolled forward each time the obligation is done. This is the one
      type the daily briefing reads for deadlines; other types link to their
      obligations instead of carrying their own due dates.
    properties:
      title:
        type: string
        description: Short, specific title (e.g. "VAT-7 for Awesome Vanlife JDG")
      obligation_kind:
        type: string
        title: Kind
        description: What sort of obligation this is
        enum: [tax_filing, tax_payment, social_insurance, subscription, insurance_renewal, registration, inspection, domain_renewal, contract_notice, document_expiry, annual_report, payment, other]
      status:
        type: string
        description: "active (tracked), paused, or ended (no longer applies)"
        enum: [active, paused, ended]
      recurrence:
        type: string
        description: RRULE for recurring obligations (e.g. FREQ=MONTHLY;BYMONTHDAY=20); empty for one-off
      next_due:
        type: date
        title: Next due
        description: Next date by which this must be done
      lead_time_days:
        type: integer
        title: Lead time (days)
        description: How many days before next_due to start reminding
        minimum: 0
      last_done:
        type: date
        title: Last done
        description: When it was last completed
      amount:
        type: number
        description: Expected amount, if it is a payment
      currency:
        type: string
        format: currency
        description: Currency of amount (ISO 4217)
      auto_pay:
        type: boolean
        title: Auto-pay
        description: True when payment happens automatically (direct debit, card on file)
      payment_method:
        type: string
        title: Payment method
        description: How it is paid (e.g. "Visa ending 1201", "mBank direct debit")
      plan:
        type: string
        description: Plan or tier, for subscriptions (e.g. "iCloud+ 2 TB")
      billing_cycle:
        type: string
        title: Billing cycle
        description: "For subscriptions: monthly, quarterly, yearly"
        enum: [weekly, monthly, quarterly, biannual, yearly, other]
      cancel_url:
        type: url
        title: Cancel URL
        description: Where to cancel or manage the subscription
      notice_period_days:
        type: integer
        title: Notice period (days)
        description: Days of notice required to cancel or not renew
        minimum: 0
      instructions:
        type: string
        widget: textarea
        description: How to do it (form name, portal, who to send what to)
      source:
        type: string
        description: "Where this came from: email, calendar, infakt, statute, manual"
      source_ref:
        type: string
        title: Source reference
        description: Reference in the source system (e.g. Gmail message ID)
      notes:
        type: string
        widget: textarea
        description: Free-form notes
      confidence:
        type: string
        description: "confirmed (by the user or an official document), from_source (read from a source, not confirmed), unverified (old or indirect data; check before relying on it)"
        enum: [confirmed, from_source, unverified]

  - name: Task
    label: Task
    labels: [task]
    ui:
      icon: "✅"
      color: "#10B981"
    description: >
      A to-do item or action the user needs to complete. Created from
      conversations, emails, or explicitly by the user.
    properties:
      title:
        type: string
        description: Short task title
      description:
        type: string
        widget: textarea
        description: Detailed description or context for the task
      status:
        type: string
        description: "Current status: pending, in_progress, blocked, done, cancelled"
      priority:
        type: string
        description: "Priority level: low, medium, high, urgent"
      due_date:
        type: date
        title: Due date
        description: Due date (YYYY-MM-DD or RFC 3339)
      completed_at:
        type: date
        title: Completed at
        description: Timestamp when task was completed
      source:
        type: string
        description: "Where this task originated: email, calendar, conversation, apple_reminders, manual"
      source_ref:
        type: string
        title: Source reference
        description: Reference ID in the source system (e.g. Gmail message ID, reminder ID)
      tags:
        type: array
        description: Free-form tags
        items:
          type: string
      confidence:
        type: string
        description: "confirmed (by the user or an official document), from_source (read from a source, not confirmed), unverified (old or indirect data; check before relying on it)"
        enum: [confirmed, from_source, unverified]

  - name: Project
    label: Project
    labels: [project]
    ui:
      icon: "📁"
      color: "#0EA5E9"
    description: >
      A collection of related tasks and goals with a defined objective.
      Can represent work projects, personal goals, or life areas.
    properties:
      name:
        type: string
        description: Project name
      description:
        type: string
        widget: textarea
        description: Purpose and scope of the project
      status:
        type: string
        description: "Current status: active, on_hold, completed, archived"
      start_date:
        type: date
        title: Start date
        description: Project start date
      target_date:
        type: date
        title: Target date
        description: Target completion date
      completed_at:
        type: date
        title: Completed at
        description: Actual completion date
      tags:
        type: array
        description: Free-form tags
        items:
          type: string
      source:
        type: string
        description: "Where the facts came from: email, drive, infakt, document, user, migration, manual"
      source_ref:
        type: string
        title: Source reference
        description: "Pointer to the evidence: Gmail thread ID, Drive file ID, inFakt ID, file path, or 'user YYYY-MM-DD' when the user said it"
      confidence:
        type: string
        description: "confirmed (by the user or an official document), from_source (read from a source, not confirmed), unverified (old or indirect data; check before relying on it)"
        enum: [confirmed, from_source, unverified]

  - name: Event
    label: Event
    labels: [event]
    ui:
      icon: "📅"
      color: "#F59E0B"
    description: >
      Something that happened or is planned — a meeting, appointment, trip, or
      milestone. Also covers calendar events synced from any provider (Google
      Calendar, Apple Calendar, Outlook, and others); the calendar-specific
      fields below are populated by sync tools when available.
    properties:
      name:
        type: string
        description: Event title / short name
      date:
        type: date
        description: Event date (RFC 3339 or YYYY-MM-DD)
      location:
        type: string
        description: Physical or virtual location of the event
      notes:
        type: string
        widget: textarea
        description: Additional context about the event
      description:
        type: string
        widget: textarea
        description: Event description or agenda
      event_id:
        type: string
        title: Event ID
        description: Event ID in the source calendar
      calendar_id:
        type: string
        title: Calendar ID
        description: Calendar ID the event belongs to
      account:
        type: string
        description: Calendar account email address
      summary:
        type: string
        description: Event title as recorded by the calendar source (alias of name)
      start:
        type: date
        description: Event start time (RFC 3339, or YYYY-MM-DD for all-day)
      end:
        type: date
        description: Event end time (RFC 3339, or YYYY-MM-DD for all-day)
      all_day:
        type: boolean
        title: All day
        description: Whether this is an all-day event
      status:
        type: string
        description: "Event status: confirmed, tentative, cancelled"
      html_link:
        type: url
        title: Calendar link
        description: URL to view the event in the calendar app
      hangout_link:
        type: url
        title: Video call link
        description: Video call link for the event
      attendees:
        type: array
        title: Attendees
        description: >
          Raw attendee payload from the calendar source (objects with email,
          displayName, responseStatus). Attendees are also linked to Person
          objects via the `involves_person` relationship, which carries the
          participant's role and response status.
        items:
          type: object
      organizer_email:
        type: string
        format: email
        title: Organiser email
        description: Email address of the event organiser
      organizer_name:
        type: string
        title: Organiser name
        description: Display name of the event organiser
      recurrence:
        type: array
        description: Recurrence rules (RRULE/EXRULE strings)
        items:
          type: string
      visibility:
        type: string
        description: "Event visibility: default, public, private, confidential"
      transparency:
        type: string
        description: "Whether event blocks time: opaque (busy) or transparent (free)"
      source:
        type: string
        description: "Where the facts came from: email, drive, infakt, document, user, migration, manual"
      source_ref:
        type: string
        title: Source reference
        description: "Pointer to the evidence: Gmail thread ID, Drive file ID, inFakt ID, file path, or 'user YYYY-MM-DD' when the user said it"
      confidence:
        type: string
        description: "confirmed (by the user or an official document), from_source (read from a source, not confirmed), unverified (old or indirect data; check before relying on it)"
        enum: [confirmed, from_source, unverified]

  - name: FinancialTransaction
    label: Financial Transaction
    labels: [finance]
    ui:
      icon: "💳"
      color: "#EF4444"
    description: >
      A financial transaction from Actual Budget or Enable Banking.
    properties:
      source:
        type: string
        description: "Origin system: actual_budget or enable_banking"
      external_id:
        type: string
        title: External ID
        description: Transaction ID in the source system
      date:
        type: date
        description: Transaction date
      amount:
        type: number
        description: Transaction amount (negative = debit, positive = credit)
      currency:
        type: string
        format: currency
        description: ISO 4217 currency code (e.g. EUR, USD, GBP)
      payee:
        type: string
        description: Payee or merchant name
      account_id:
        type: string
        title: Account ID
        description: Account ID in the source system
      account_name:
        type: string
        title: Account name
        description: Human-readable account name
      category:
        type: string
        description: Budget category assigned to this transaction
      memo:
        type: string
        widget: textarea
        description: Transaction memo or notes
      cleared:
        type: boolean
        description: Whether the transaction has cleared the bank
      reconciled:
        type: boolean
        description: Whether the transaction has been reconciled
      iban:
        type: string
        description: IBAN of the counterpart account (Enable Banking only)
      source_ref:
        type: string
        title: Source reference
        description: "Pointer to the evidence: Gmail thread ID, Drive file ID, inFakt ID, file path, or 'user YYYY-MM-DD' when the user said it"
      confidence:
        type: string
        description: "confirmed (by the user or an official document), from_source (read from a source, not confirmed), unverified (old or indirect data; check before relying on it)"
        enum: [confirmed, from_source, unverified]

  - name: Contact
    label: Contact
    labels: [contact]
    ui:
      icon: "📇"
      color: "#8B5CF6"
    description: >
      A raw address-book contact from Apple Contacts, Gmail, or another source,
      distinct from the enriched Person entity.
    properties:
      source:
        type: string
        description: "Origin: apple_contacts, gmail, manual"
      source_id:
        type: string
        title: Source ID
        description: Native contact ID in the source system
      first_name:
        type: string
        title: First name
        description: First name
      last_name:
        type: string
        title: Last name
        description: Last name
      display_name:
        type: string
        title: Display name
        description: Full display name
      emails:
        type: array
        title: Email addresses
        description: Email address entries from the source, each an object with label and value
        items:
          type: object
      phones:
        type: array
        title: Phone numbers
        description: Phone number entries from the source, each an object with label and value
        items:
          type: object
      organization:
        type: string
        title: Organisation
        description: Company or organisation name
      job_title:
        type: string
        title: Job title
        description: Job title or role
      notes:
        type: string
        widget: textarea
        description: Free-form notes field from the contact
      groups:
        type: array
        description: Contact group names
        items:
          type: string
      source_ref:
        type: string
        title: Source reference
        description: "Pointer to the evidence: Gmail thread ID, Drive file ID, inFakt ID, file path, or 'user YYYY-MM-DD' when the user said it"
      confidence:
        type: string
        description: "confirmed (by the user or an official document), from_source (read from a source, not confirmed), unverified (old or indirect data; check before relying on it)"
        enum: [confirmed, from_source, unverified]

  - name: Place
    label: Place
    labels: [place]
    ui:
      icon: "📍"
      color: "#14B8A6"
    description: >
      A physical location, city, venue, or address.
    properties:
      place_id:
        type: string
        title: Place ID
        description: Google Places unique identifier
      name:
        type: string
        description: Place name
      country:
        type: string
        format: country
        description: Country (ISO 3166-1 code, e.g. DE)
      address:
        type: string
        description: Formatted address string
      lat:
        type: number
        title: Latitude
        description: Latitude coordinate
        minimum: -90
        maximum: 90
      lng:
        type: number
        title: Longitude
        description: Longitude coordinate
        minimum: -180
        maximum: 180
      types:
        type: array
        description: Google Places type strings (e.g. restaurant, cafe)
        items:
          type: string
      rating:
        type: number
        description: Google rating
        minimum: 0
        maximum: 5
      website:
        type: url
        description: Official website URL
      phone:
        type: string
        format: phone
        description: International phone number
      google_maps_url:
        type: url
        title: Google Maps URL
        description: Google Maps URL for this place
      notes:
        type: string
        widget: textarea
        description: Free-form notes about this place
      source:
        type: string
        description: "Where the facts came from: email, drive, infakt, document, user, migration, manual"
      source_ref:
        type: string
        title: Source reference
        description: "Pointer to the evidence: Gmail thread ID, Drive file ID, inFakt ID, file path, or 'user YYYY-MM-DD' when the user said it"
      confidence:
        type: string
        description: "confirmed (by the user or an official document), from_source (read from a source, not confirmed), unverified (old or indirect data; check before relying on it)"
        enum: [confirmed, from_source, unverified]

  - name: Note
    label: Note
    labels: [note]
    ui:
      icon: "🗒️"
      color: "#64748B"
    description: >
      A free-form note, idea, thought, reference, or captured memory — created
      by the user or extracted from conversations, emails, or documents.
    properties:
      title:
        type: string
        description: Short title or heading for the note
      name:
        type: string
        description: Short title (accepted alias of title; personal-kb compatibility)
      content:
        type: string
        widget: textarea
        description: Full content of the note (markdown supported)
      source:
        type: string
        description: "Where this note came from: conversation, email, document, manual"
      source_ref:
        type: string
        title: Source reference
        description: Reference to the source (e.g. Gmail message ID, file path)
      tags:
        type: array
        description: Free-form tags
        items:
          type: string
      confidence:
        type: string
        description: "confirmed (by the user or an official document), from_source (read from a source, not confirmed), unverified (old or indirect data; check before relying on it)"
        enum: [confirmed, from_source, unverified]

  - name: File
    label: File
    labels: [file]
    ui:
      icon: "📄"
      color: "#3B82F6"
    description: >
      A supporting document, attachment, or file referenced by another object in
      the knowledge graph, such as a note's source document or a task attachment.
    properties:
      name:
        type: string
        description: File name
      path:
        type: string
        description: Local file path or storage location
      url:
        type: url
        description: URL where the file can be accessed
      mime_type:
        type: string
        title: MIME type
        description: MIME type (e.g. application/pdf, image/png)
      size:
        type: integer
        description: File size in bytes
        minimum: 0
      source:
        type: string
        description: "Where the file originated: email, document, download, manual"
      source_ref:
        type: string
        title: Source reference
        description: Reference in the source system (e.g. attachment ID, message ID)
      description:
        type: string
        widget: textarea
        description: Description of the file contents
      confidence:
        type: string
        description: "confirmed (by the user or an official document), from_source (read from a source, not confirmed), unverified (old or indirect data; check before relying on it)"
        enum: [confirmed, from_source, unverified]

  - name: Fact
    label: Fact
    labels: [fact]
    ui:
      icon: "💡"
      color: "#EAB308"
    description: >
      A standalone fact that does not fit any other category — a durable piece
      of information the agent should recall verbatim.
    properties:
      name:
        type: string
        description: Short label for the fact
      statement:
        type: string
        widget: textarea
        description: The fact itself
      source:
        type: string
        description: "Where the facts came from: email, drive, infakt, document, user, migration, manual"
      source_ref:
        type: string
        title: Source reference
        description: "Pointer to the evidence: Gmail thread ID, Drive file ID, inFakt ID, file path, or 'user YYYY-MM-DD' when the user said it"
      confidence:
        type: string
        description: "confirmed (by the user or an official document), from_source (read from a source, not confirmed), unverified (old or indirect data; check before relying on it)"
        enum: [confirmed, from_source, unverified]

  - name: Habit
    label: Habit
    labels: [habit]
    ui:
      icon: "🔁"
      color: "#EC4899"
    description: >
      A recurring behaviour or routine the user is tracking. Completion is
      monitored and streaks and gaps surface in the daily briefing.
    properties:
      name:
        type: string
        description: Habit name (e.g. Morning run, Read 30 minutes)
      description:
        type: string
        widget: textarea
        description: Details about the habit and its goal
      frequency:
        type: string
        description: "How often: daily, weekdays, weekly, custom"
      target_time:
        type: string
        format: time
        title: Target time
        description: Preferred time of day (24-hour HH:MM, e.g. 07:00)
      status:
        type: string
        description: "Current status: active, paused, archived"
      streak_current:
        type: integer
        title: Current streak
        description: Current consecutive completion streak (days)
        minimum: 0
      streak_best:
        type: integer
        title: Best streak
        description: Best ever consecutive streak (days)
        minimum: 0
      last_completed:
        type: date
        title: Last completed
        description: Date last completed
      tags:
        type: array
        description: Free-form tags
        items:
          type: string
      source:
        type: string
        description: "Where the facts came from: email, drive, infakt, document, user, migration, manual"
      source_ref:
        type: string
        title: Source reference
        description: "Pointer to the evidence: Gmail thread ID, Drive file ID, inFakt ID, file path, or 'user YYYY-MM-DD' when the user said it"
      confidence:
        type: string
        description: "confirmed (by the user or an official document), from_source (read from a source, not confirmed), unverified (old or indirect data; check before relying on it)"
        enum: [confirmed, from_source, unverified]

relationshipTypes:
  - name: assigned_to
    label: Assigned To
    description: Links a task to the person responsible for it.
    sourceType: Task
    targetType: Person

  - name: belongs_to_project
    label: Belongs To Project
    description: Links a task to its parent project.
    sourceType: Task
    targetType: Project

  - name: involves_person
    label: Involves Person
    description: >
      Links an event or note to a person involved. For events this is the
      attendee link; the edge's properties record the participant's role and
      calendar response status.
    sourceTypes: [Event, Note]
    targetType: Person
    properties:
      role:
        type: string
        title: Role
        description: "Participant role: organizer, required, optional, resource"
      response_status:
        type: string
        title: Response status
        description: "Calendar response: accepted, declined, tentative, needsAction, none"

  - name: located_at
    label: Located At
    description: Links an event to its physical place.
    sourceType: Event
    targetType: Place

  - name: related_to_contact
    label: Related To Contact
    description: Links a person in the knowledge graph to their contact record.
    sourceType: Person
    targetType: Contact

  - name: has_transaction
    label: Has Transaction
    description: Links a project or note to a related financial transaction.
    sourceType: Project
    targetType: FinancialTransaction

  - name: references_file
    label: References File
    description: Links a note or task to a relevant file in the file registry.
    sourceTypes: [Note, Task]
    targetType: File

  - name: triggered_task
    label: Triggered Task
    description: >
      Links an event, note, or obligation to a task it spawned. The
      obligations-watcher creates one Task per upcoming Obligation occurrence
      and links it here; completing that Task is how an Obligation is marked done.
    sourceTypes: [Event, Note, Obligation]
    targetType: Task

  # ── v4.0.0: links used by the existing graph, now declared ──────────────

  - name: related_to
    label: Related To
    description: >
      Generic association between core objects when no more specific link
      fits. For Person → Person, set `relation` (partner, parent, child,
      sibling, relative, friend, colleague).
    sourceTypes: [Person, Project, Event, Note, Task, Organization]
    targetTypes: [Person, Project, Event, Note, Task, Organization, Place]
    properties:
      relation:
        type: string
        description: "For Person → Person: partner, spouse, parent, child, sibling, relative, friend, colleague"

  - name: works_for
    label: Works For
    description: A person works for, or acts on behalf of, an organisation.
    sourceType: Person
    targetType: Organization
    properties:
      role:
        type: string
        description: Role at the organisation (e.g. "accountant", "insurance agent")

  - name: works_on
    label: Works On
    description: A person works on a project.
    sourceType: Person
    targetType: Project
    properties:
      role:
        type: string
        description: Role on the project

  - name: manages
    label: Manages
    description: A person manages or is responsible for a project.
    sourceType: Person
    targetType: Project

  - name: advises
    label: Advises
    description: A person advises another person or a project (lawyer, accountant, mentor).
    sourceType: Person
    targetTypes: [Person, Project]

  - name: owns
    label: Owns
    description: A person owns a project or another core object. Area packs extend this to their own types.
    sourceType: Person
    targetTypes: [Project, Place]
    properties:
      share_percent:
        type: number
        title: Share (%)
        description: Ownership share in percent, when shared
        minimum: 0
        maximum: 100
      holder_role:
        type: string
        title: Holder role
        description: "owner, joint_owner, authorised_user"

  - name: mentions
    label: Mentions
    description: A note (including an imported email) mentions a person, organisation, or project.
    sourceType: Note
    targetTypes: [Person, Organization, Project, Event, Obligation]

  - name: has_obligation
    label: Has Obligation
    description: >
      The subject an obligation belongs to (a person, project, or, via area
      packs, a company, vehicle, policy, domain, or account).
    sourceTypes: [Person, Project, Organization]
    targetType: Obligation

  - name: payable_to
    label: Payable To
    description: The organisation an obligation is paid to, filed with, or provided by.
    sourceType: Obligation
    targetType: Organization

  - name: sourced_from
    label: Sourced From
    description: Provenance — the note (e.g. imported email) or file a fact about this object came from.
    sourceTypes: [Person, Organization, Obligation, Project, Event, Fact, Task]
    targetTypes: [Note, File]

# Migration hints for projects still on the bundled personal-memory v2.x pack.
# `from` names the old type (absent from this version), `to` names its
# replacement here — the server validates that every `to` exists.
migrations:
  from_version: "2.1.0"
  type_renames:
    - from: Memo
      to: Note
    - from: CalendarEvent
      to: Event

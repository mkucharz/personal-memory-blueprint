name: pm-money
version: "1.1.0"
author: memory
repositoryUrl: https://github.com/mkucharz/personal-memory-blueprint
description: >
  Area pack of the personal-memory blueprint: where the user's money and
  online services live — bank and fintech accounts, tax and social-insurance
  payment accounts, online service accounts (cloud, SaaS, airline profiles),
  and the invoices the user's companies issue and receive. Recurring charges
  are core Obligation objects (obligation_kind=subscription) linked with
  `has_obligation`. Store only account hints (last 4 digits), never full
  numbers or credentials. v1.1.0 adds Invoice.

objectTypes:
  - name: Invoice
    label: Invoice
    labels: [invoice, finance]
    ui:
      icon: "🧾"
      color: "#0D9488"
    description: >
      An invoice the user or one of their companies issued (sales) or
      received (costs). Seller and buyer are linked with `issued_by` and
      `billed_to`; the agreement it bills under with `under_contract`; the
      Obligation occurrence it settles with `settles`. For received invoices
      paid automatically, record them only when they matter (disputes,
      business costs, unusual amounts).
    properties:
      number:
        type: string
        description: Invoice number as printed (e.g. "FV 12/11/2026", "509755310326")
      direction:
        type: string
        description: "issued (the user's company is the seller) or received (the user or company is the buyer)"
        enum: [issued, received]
      status:
        type: string
        description: Lifecycle status
        enum: [draft, issued, sent, paid, partially_paid, overdue, disputed, cancelled]
      issue_date:
        type: date
        title: Issue date
        description: Date of issue
      sale_date:
        type: date
        title: Sale / service date
        description: Date or end of the period the invoice covers
      due_date:
        type: date
        title: Due date
        description: Payment due date
      paid_on:
        type: date
        title: Paid on
        description: Date the invoice was fully paid
      net_amount:
        type: number
        title: Net amount
        description: Amount excluding VAT
      vat_amount:
        type: number
        title: VAT amount
        description: VAT amount (0 if not VAT-registered / reverse charge)
      gross_amount:
        type: number
        title: Gross amount
        description: Total payable
      currency:
        type: string
        format: currency
        description: Currency (ISO 4217)
      vat_treatment:
        type: string
        title: VAT treatment
        description: How VAT applies
        enum: [standard, exempt, reverse_charge, not_applicable]
      description:
        type: string
        widget: textarea
        description: What was sold or bought (lines, hours, period)
      e_invoice_id:
        type: string
        title: E-invoice ID
        description: KSeF number (PL) or EHF/PEPPOL reference (NO)
      source:
        type: string
        description: "Where it came from: infakt, fiken, email, manual"
      source_ref:
        type: string
        title: Source reference
        description: ID in the source system or Gmail message ID
      notes:
        type: string
        widget: textarea
        description: Free-form notes


  - name: Account
    label: Account
    labels: [account, finance]
    ui:
      icon: "🏦"
      color: "#059669"
    description: >
      An account the user or one of their companies holds with an outside
      organisation: a bank or fintech account, a tax or ZUS payment account,
      a card, or an online service account (AWS, Google Workspace, Apple ID,
      an airline profile). Use status=closed rather than deleting closed
      accounts.
    properties:
      name:
        type: string
        description: Display name (e.g. "Revolut (personal)", "mBank business current account")
      account_kind:
        type: string
        title: Kind
        description: What sort of account this is
        enum: [bank, fintech, card, savings, brokerage, tax_payment, social_insurance, online_service, loyalty, other]
      status:
        type: string
        description: Lifecycle status
        enum: [open, closed, dormant]
      holder:
        type: string
        description: "Who holds it: personal, joint, or the company name"
      currency:
        type: string
        format: currency
        description: Main currency (ISO 4217)
      number_hint:
        type: string
        title: Number hint
        description: Last 4 digits or a masked identifier only — never a full account or card number
      account_id:
        type: string
        title: Account ID
        description: Non-secret identifier in the provider's system (e.g. AWS account ID, customer number)
      login_email:
        type: string
        format: email
        title: Login email
        description: Email used to sign in
      opened_on:
        type: date
        title: Opened on
        description: When the account was opened
      closed_on:
        type: date
        title: Closed on
        description: When the account was closed
      notes:
        type: string
        widget: textarea
        description: Free-form notes (no secrets)

relationshipTypes:
  - name: held_with
    label: Held With
    description: The organisation (bank, provider) an account is held with.
    sourceType: Account
    targetType: Organization

  - name: owns
    label: Owns
    description: A person or company holds an account.
    sourceTypes: [Person, LegalEntity]
    targetType: Account
    properties:
      share_percent:
        type: number
        title: Share (%)
        description: Ownership share in percent, when shared
        minimum: 0
        maximum: 100
      holder_role:
        type: string
        title: Holder role
        description: "owner, joint_owner, authorised_user"

  - name: used_by
    label: Used By
    description: An account (e.g. a cloud or SaaS account) is used by a project or company.
    sourceType: Account
    targetTypes: [Project, LegalEntity]

  - name: has_obligation
    label: Has Obligation
    description: An account carries a recurring charge or deadline (subscription, fee, card expiry), or an unpaid issued invoice carries a payment follow-up.
    sourceTypes: [Account, Invoice]
    targetType: Obligation

  - name: paid_from
    label: Paid From
    description: An obligation is paid from this account.
    sourceType: Obligation
    targetType: Account

  - name: has_transaction
    label: Has Transaction
    description: A transaction belongs to an account.
    sourceType: Account
    targetType: FinancialTransaction

  - name: sourced_from
    label: Sourced From
    description: Provenance for account and invoice facts (the email or PDF the invoice came in).
    sourceTypes: [Account, Invoice]
    targetTypes: [Note, File]

  # ── v1.1.0: invoices ────────────────────────────────────────────────────

  - name: issued_by
    label: Issued By
    description: The seller that issued the invoice (one of the user's companies, an organisation, or a person).
    sourceType: Invoice
    targetTypes: [LegalEntity, Organization, Person]

  - name: billed_to
    label: Billed To
    description: The buyer the invoice is addressed to.
    sourceType: Invoice
    targetTypes: [LegalEntity, Organization, Person]

  - name: under_contract
    label: Under Contract
    description: The agreement the invoice bills under (e.g. a consultancy or commission agreement).
    sourceType: Invoice
    targetType: Contract

  - name: settles
    label: Settles
    description: The Obligation occurrence this invoice fulfils (an invoicing duty or a recurring charge).
    sourceType: Invoice
    targetType: Obligation

  - name: paid_into
    label: Paid Into
    description: The account an issued invoice is paid into, or a received invoice is paid from.
    sourceType: Invoice
    targetType: Account
